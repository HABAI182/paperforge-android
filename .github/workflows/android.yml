name: Android compile and isolated candidate
on:
  push:
    branches: [main]
    paths: ['app/**', 'full-app/**', 'ocr-paddle/**', 'jpeg2000/**', 'opencv-mobile/**', 'format-engine/**', 'archive-core/**', 'office-engine/**', 'network-engine/**', '*.kts', 'gradle*', 'gradle/**', 'scripts/**', '.github/workflows/**', 'docs/development/distribution-policy.json']
  pull_request:
    paths: ['app/**', 'full-app/**', 'ocr-paddle/**', 'jpeg2000/**', 'opencv-mobile/**', 'format-engine/**', 'archive-core/**', 'office-engine/**', 'network-engine/**', '*.kts', 'gradle*', 'gradle/**', 'scripts/**', '.github/workflows/**', 'docs/development/distribution-policy.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CCACHE_DIR: /tmp/paperforge-ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: /usr/bin/ccache
      CMAKE_CXX_COMPILER_LAUNCHER: /usr/bin/ccache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Free unused preinstalled toolchains
        run: |
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/lib/android/sdk/system-images
          df -h /
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Provision Android SDK command line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '13114758'
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install compiler cache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache && ccache --version
      - name: Restore native compiler cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-ndk28-x86_64-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.os }}-ndk28-x86_64-v1-
      - name: Compile an isolated x86_64 development package
        run: python3 scripts/build_distribution.py --abi x86_64 --isolated-ci
      - name: Compile the optional format and network engines
        run: ./gradlew :format-engine:assembleDebug :network-engine:assembleDebug -PpaperforgeAbis=x86_64 --console=plain --build-cache
      - name: Cache pinned Office runtime download
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: office-engine/runtime/downloads/
          key: office-runtime-26.2.6.3-x86_64-129-cfaf9eea
      - name: Compile an isolated full application
        run: python3 scripts/build_distribution.py --abi x86_64 --full --isolated-ci --output build/distributions/development/full-x86_64
      - name: Retain candidate and exact package inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PaperForge-isolated-ci-${{ github.sha }}
          path: |
            build/distributions/development/x86_64/
            build/distributions/development/full-x86_64/
          retention-days: 7
          if-no-files-found: error
      - name: Report native compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose
      - name: Save native compiler cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-ndk28-x86_64-v1-${{ github.run_id }}-${{ github.run_attempt }}
