  <rect x="0" y="240" width="1080" height="1608" fill="#EFEFEC"/>
  <text x="24" y="280" font-size="20" fill="#8A8A85">目标 · 画布：点按全屏 / 双击缩放 / 左右滑翻页（手势不变，但不再有浮动页码）</text>

