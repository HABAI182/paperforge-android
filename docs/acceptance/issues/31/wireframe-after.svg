<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title>PaperForge 编辑页线框 · 目标（1080×2340）</title>
  <desc>低保真线框：目标编辑器。顶栏为返回、标题与页码（点击重命名）、撤销、重做、导出；画布下为常驻缩略图条（点选翻页、长按多选、右端管理进入页面网格）；底部为一行六格一级操作：加页、裁剪、滤镜、旋转、删除、更多。「更多」改为四加二组弹层，承载其余二十项与识别设置。标注各处点击步数。</desc>

  <rect x="0" y="0" width="1080" height="2340" fill="#FFFFFF"/>

  <!-- 状态栏 -->
  <text x="40" y="48" font-size="26" fill="#1A1A1A">9:41</text>
  <rect x="884" y="34" width="16" height="14" fill="#1A1A1A"/>
  <rect x="906" y="28" width="16" height="20" fill="#1A1A1A"/>
  <rect x="928" y="22" width="16" height="26" fill="#1A1A1A"/>
  <rect x="962" y="24" width="52" height="24" rx="5" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="968" y="30" width="32" height="12" fill="#1A1A1A"/>

  <!-- 顶部栏 -->
  <rect x="0" y="72" width="1080" height="168" fill="#FAFAF8"/>
  <line x1="0" y1="240" x2="1080" y2="240" stroke="#D5D5D0" stroke-width="2"/>
