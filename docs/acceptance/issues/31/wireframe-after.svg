  <text x="112" y="144" font-size="32" font-weight="600" fill="#1A1A1A">发票 2026-10</text>
  <text x="112" y="190" font-size="22" fill="#6B6B66">3 / 8 页 · 点击名称重命名</text>
  <text x="612" y="178" font-size="38" fill="#1A1A1A">↺</text>
  <text x="712" y="178" font-size="38" fill="#1A1A1A">↻</text>
  <text x="631" y="222" font-size="18" fill="#8A8A85" text-anchor="middle">1 步</text>
  <text x="731" y="222" font-size="18" fill="#8A8A85" text-anchor="middle">1 步</text>
  <rect x="856" y="106" width="176" height="88" rx="44" fill="#1A1A1A"/>
  <text x="944" y="164" font-size="26" fill="#FFFFFF" text-anchor="middle">导出</text>
  <text x="944" y="222" font-size="18" fill="#8A8A85" text-anchor="middle">2 步</text>

