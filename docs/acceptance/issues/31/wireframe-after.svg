  <!-- 分组弹层说明 -->
  <rect x="90" y="1370" width="470" height="340" rx="14" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="110" y="1412" font-size="21" font-weight="600" fill="#1A1A1A">「更多」→ 4+2 组弹层</text>
  <text x="110" y="1452" font-size="19" fill="#3A3A36">识别与文字：识字 / 框选 / 设置</text>
  <text x="110" y="1486" font-size="19" fill="#3A3A36">页面与结构：网格 / 拆分 / 长票据</text>
  <text x="110" y="1520" font-size="19" fill="#3A3A36">修复与增强：裁边 / 曲面 / 清理</text>
  <text x="110" y="1554" font-size="19" fill="#3A3A36">智能：翻译与智能工具</text>
  <text x="110" y="1588" font-size="19" fill="#3A3A36">导出与记录：图片包 / 诊断包 / 票据</text>
  <text x="110" y="1622" font-size="19" fill="#3A3A36">视图：全屏检查</text>
  <text x="110" y="1666" font-size="17" fill="#8A8A85">20 项 + 1 个识别设置块，不再单列长滚动</text>

  <!-- 缩略图条说明 -->
  <rect x="580" y="1370" width="410" height="340" rx="14" fill="#FFFFFF" stroke="#C2410C" stroke-width="2"/>
  <text x="600" y="1412" font-size="21" font-weight="600" fill="#1A1A1A">缩略图条（常驻）</text>
  <text x="600" y="1452" font-size="19" fill="#3A3A36">点选 = 翻页（1 步）</text>
  <text x="600" y="1486" font-size="19" fill="#3A3A36">长按 = 多选（1 步）</text>
  <text x="600" y="1520" font-size="19" fill="#3A3A36">长按 → 旋转 / 删除（2 步）</text>
  <text x="600" y="1554" font-size="19" fill="#3A3A36">「管理」= 页面网格（1 步）</text>
  <text x="600" y="1588" font-size="19" fill="#3A3A36">页码并入标题与缩略图高亮</text>
  <text x="600" y="1622" font-size="19" fill="#3A3A36">全部 8 页可横滑；全屏时隐藏</text>

  <text x="24" y="1758" font-size="19" fill="#6B6B66">缩略图条常驻占 80dp（≈240px），画布相应缩短；全屏检查时仍隐藏</text>
  <text x="24" y="1792" font-size="19" fill="#6B6B66">底部数字＝从本屏起算的点击步数；橙色＝相对现状有变化</text>
  <text x="24" y="1826" font-size="19" fill="#C2410C">橙色变化：加页 1→2 · 旋转 2→1 · 删除 3→2 · 页面网格 2→1 · 识字 1→2</text>

